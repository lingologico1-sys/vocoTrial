name = "vocotrial"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Because this file exists, Pages takes plain-text vars from here and the
# dashboard will only accept Secrets. So the split is:
#
#   here      the model ids below — not sensitive, they ship in every request
#   dashboard OPENAI_API_KEY, GEMINI_API_KEY, GEMINI_API_KEY2, GOOGLE_API_KEY
#             (encrypted, per environment)
#
# There are two Google keys because there are two Google APIs, and a model is
# served by the one that carries it. GEMINI_API_KEY* are Vertex keys (GCP
# billing, service-account-bound); GOOGLE_API_KEY is AI Studio, for models with
# no Vertex build. See functions/api/_vertex.ts and _aistudio.ts.
#
# Locally, put the keys in .dev.vars (gitignored) and run `npm run dev:api`.
#
# The keys stay server-side by construction: the Live socket is relayed with the
# key attached in the Worker (functions/api/live/gemini.ts) and image requests
# are made from the Worker too. No key is ever readable from the client, so a
# leaked page cannot spend the account.
#
# There is nothing under [vars] today. The table stays because this file's
# existence is what makes Pages read plain-text vars from here and take only
# Secrets from the dashboard — the split described above depends on it.
#
# Model ids used to live here. They moved to src/realtime/models.ts once the UI
# grew a picker: the browser and the Worker have to agree on the list, and a var
# can only carry one value. The Worker still owns the mapping — the client sends
# a key like "gemini-flash-31", never a raw model id.
#
# OPENAI_REALTIME_VOICE was the last entry, and went with OpenAI Realtime.
# Gemini's voice is picked in the settings panel and set in the setup frame.
[vars]

# The shared face library. faceKit publishes a kit here and every other browser
# reads it back, which is the only way a face authored on one laptop reaches a
# student on another — kits otherwise live in the authoring browser's IndexedDB
# and go no further. See functions/api/faces/.
#
# Create it once before the first publish:
#
#   npx wrangler r2 bucket create vocotrial-faces
#
# Unlike the API keys, this is not a secret and belongs in this file: a binding
# name is not a credential, and Pages needs it here to inject the binding.
[[r2_buckets]]
binding = "FACES"
bucket_name = "vocotrial-faces"

# The shared evaluator library. tutorBench authors a level scale here and every
# other browser reads it back — the same journey faces made, and for the same
# reason: a scale authored on one laptop has to reach a student on another.
#
# CREATE THE BUCKET BEFORE PUSHING A BINDING FOR IT:
#
#   npx wrangler r2 bucket create vocotrial-evaluators
#
# Not before the first save — before the first *deploy*. Pages validates every
# binding when it builds, so a block naming a bucket that does not exist yet
# fails the whole deployment, and the site stays on the previous commit. It
# reads as a build failure rather than as a missing bucket, and the fix is to
# create the bucket and redeploy; nothing needs reverting. Learned by doing it
# in the wrong order.
#
# Its own bucket rather than a prefix inside FACES, because a binding named
# FACES holding level scales is a lie the next reader has to unpick. Buckets
# cost nothing to create. See functions/api/evaluators/.
[[r2_buckets]]
binding = "EVALUATORS"
bucket_name = "vocotrial-evaluators"

# The published session library. liveTrial publishes one tutor setup here and
# the student page at /eleve reads it back — the only way the language, prompt,
# voice, face and motion tuned on one laptop reach a student on another. Without
# it a student meets the defaults, which is a different tutor wearing the same
# name.
#
# CREATE THE BUCKET BEFORE PUSHING A BINDING FOR IT, for the reason spelled out
# above on EVALUATORS — Pages validates bindings at build time, so a block
# naming a bucket that does not exist fails the whole deployment:
#
#   npx wrangler r2 bucket create vocotrial-sessions
#
# Its own bucket rather than a prefix inside EVALUATORS, on the same reasoning:
# a binding named for one thing holding another is a lie the next reader has to
# unpick, and buckets cost nothing to create.
[[r2_buckets]]
binding = "SESSIONS"
bucket_name = "vocotrial-sessions"

# The shared question-sheet library. A sheet is one lesson's questions, the
# consigne the student reads, and the structures the teacher wants to hear.
# Authored on /consignes, chosen at publish time on liveTrial, and copied into
# the published session as text — so this bucket is a teacher's filing cabinet
# rather than part of what a student's browser reads. See functions/api/sheets/.
#
# CREATE THE BUCKET BEFORE PUSHING A BINDING FOR IT, for the reason spelled out
# above on EVALUATORS — Pages validates bindings at build time, so a block
# naming a bucket that does not exist fails the whole deployment:
#
#   npx wrangler r2 bucket create vocotrial-sheets
#
# Its own bucket rather than a prefix inside EVALUATORS, on the same reasoning
# as SESSIONS: a binding named for one thing holding another is a lie the next
# reader has to unpick, and buckets cost nothing to create.
[[r2_buckets]]
binding = "SHEETS"
bucket_name = "vocotrial-sheets"
