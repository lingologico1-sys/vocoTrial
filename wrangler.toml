name = "vocotrial"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Because this file exists, Pages takes plain-text vars from here and the
# dashboard will only accept Secrets. So the split is:
#
#   here      the model ids below — not sensitive, they ship in every request
#   dashboard OPENAI_API_KEY, GEMINI_API_KEY, GEMINI_API_KEY2
#             (encrypted, per environment)
#
# The Google keys are Vertex AI keys — PanelForge's, off the same GCP project —
# because every Google call here goes to aiplatform.googleapis.com now. See
# functions/api/_vertex.ts.
#
# Locally, put the keys in .dev.vars (gitignored) and run `npm run dev:api`.
#
# The keys stay server-side by construction: functions/api/session/* exchange
# them for a short-lived credential and only that reaches the browser. Neither
# key is ever readable from the client, so a leaked page cannot spend the
# account.
[vars]
# The model ids used to live here. They moved to src/realtime/models.ts once
# the UI grew a picker: the browser and the Worker have to agree on the list,
# and a var can only carry one value. The Worker still owns the mapping — the
# client sends a key like "gemini-flash", never a raw model id.
#
# Voice for the OpenAI session. Gemini's voice is set in the setup message
# the browser sends (src/realtime/gemini.ts).
OPENAI_REALTIME_VOICE = "marin"
