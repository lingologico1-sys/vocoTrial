name = "vocotrial"
main = "./worker/index.js"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]

# MIGRATED FROM PAGES TO WORKERS. Two things replace `pages_build_output_dir`:
# `[assets]` serves dist/ as static files, and `main` points at the Worker that
# `wrangler pages functions build` compiles the functions/ directory into (see
# the build script in package.json). Nothing under functions/ changed — the
# compiler emits the same routing template Pages itself ran, so onRequest,
# context.next() and the _middleware gate all behave exactly as before.
#
# The compiled Worker is written to worker/, NOT into dist/. It could go in
# either, but a file inside the assets directory is a file served to the public,
# and the Worker's own source is not something to hand out.
#
# Requests are matched against dist/ first; anything matching an asset is served
# without waking the Worker. /api/* matches no asset, so it reaches the compiled
# Functions. Everything else falls through to the SPA — see not_found_handling.

# Both the custom domain and the workers.dev hostname answer. Declaring `routes`
# turns workers.dev off by default, so it is turned back on explicitly: it is
# the fallback to reach for when DNS is the thing being debugged.
#
# ONCE `routes` EXISTS IT IS THE WHOLE LIST. A route added in the dashboard is
# configuration this file does not know about, and the next `wrangler deploy`
# replaces the Worker's configuration with what is written here — silently
# dropping it. Add domains here, not there.
#
# voco.lingomondo.app rather than the old vocotrial.pages.dev, and the choice is
# load-bearing beyond tidiness: LingoLecto pins this origin in VOCO_ORIGIN and
# every published Phono loads its speaking face from it. A custom domain is the
# last hostname this app needs, so that pin never has to move again.
routes = [{ pattern = "voco.lingomondo.app", custom_domain = true }]
workers_dev = true
preview_urls = true

[observability]
enabled = true

# The SPA. `not_found_handling` replaces what public/_redirects used to do with
# `/*  /index.html  200`: Workers static assets honour only real redirect
# statuses in a _redirects file, and the 200-rewrite that gives a client-side
# router its deep links is this setting instead. public/_headers is unchanged
# and still honoured.
#
# The `binding` is not optional here. The compiled Functions worker ends its
# route chain with `env.ASSETS.fetch(request)` — that call is what serves
# index.html — so without this binding every path that is not an /api/* route
# throws instead of rendering the app.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# WHERE THE KEYS LIVE, NOW THAT PAGES DOES NOT.
#
# Under Pages the split was forced: because this file existed, Pages read
# plain-text vars from it and the dashboard would accept only Secrets. Workers
# does not work that way, and the split is now a choice rather than a rule:
#
#   here      anything not sensitive. `wrangler deploy` REPLACES the Worker's
#             vars with what is in this file, so a plain-text var set in the
#             dashboard is overwritten by the next deploy. Put it here.
#   secrets   GEMINI_JSON01..03 and GOOGLE_API_KEY —
#             OPENAI_API_KEY — `npx wrangler secret put NAME`, or the Worker's
#             Variables and Secrets page. Deploys never touch these, so they are
#             set once and survive every push.
#
# There is nothing to declare here today, which is why there is no [vars] table.
# Under Pages the empty table was load-bearing — its existence is what moved the
# vars/secrets boundary — and under Workers it would be an empty table meaning
# nothing. Model ids are not vars either: they live in src/realtime/models.ts,
# because the picker and the server allowlist have to agree and a var holds one
# value.
#
# The keys stay server-side by construction: both live sockets are relayed with
# the credential attached in the Worker (functions/api/live/gemini.ts and
# openai.ts) and image requests are made from the Worker too. No key is ever
# readable from the client, so a leaked page cannot spend the account. That is
# also why the OpenAI path is a relay rather than the browser-direct WebRTC that
# provider recommends — see the header of that file for the other half of the
# reason, which is about the audio.

# ---------------------------------------------------------------------------
# SECRETS STORE — the account's one store, id below, created 2025-05-09.
# ---------------------------------------------------------------------------
#
# There is exactly ONE store per account (`store create` fails with
# maximum_stores_exceeded), so this id is not going to change. List what it
# holds with:
#   npx wrangler secrets-store secret list ab2656b141cc49a2833f33f1023737d7 --remote
#
# `binding` is the name the code sees; `secret_name` is the name in the store.
# They do not have to match, and that is what makes an account-wide store
# usable: OPENAI_API_KEY and ELEVENLABS_API_KEY are the same credentials any
# other Worker would want, so they keep plain names and are shared. The three
# that are nobody else's business are prefixed VOCOTRIAL_ and mapped back to
# their short names here — the same convention bannerMaker uses for
# BANNERMAKER_ACCESS_CODE.
#
# EVERY SECRET MUST CARRY THE `workers` SCOPE or the deploy is rejected, and a
# binding naming a secret that does not exist fails the deploy outright.
#
# DECLARE BINDINGS HERE, NOT IN THE DASHBOARD. A binding added through the
# Worker's Bindings page is configuration this file does not know about, and the
# next `wrangler deploy` replaces the Worker's configuration with what is
# written here — silently dropping it. The same trap as `routes`.
#
# THE VERTEX SERVICE ACCOUNTS CANNOT LIVE HERE. A store value is capped at 1024
# characters and a service-account JSON is about 2.3 KB, most of it the private
# key. Ordinary Worker secrets allow 5 KB, so GEMINI_JSON01..03 stay on
# `wrangler secret put`. That split is what the store is designed for: short
# keys shared between Workers go in the store, credential files stay per-Worker.
#
# Reading these needs functions/api/_secrets.ts — a bound secret arrives as an
# object with an async get(), not a string, and the middleware resolves them
# before any handler runs. Adding a block here means adding the binding name to
# SECRET_BINDING_NAMES in that file, or it is simply never resolved and reads as
# "not configured".

[[secrets_store_secrets]]
binding = "SITE_PASSWORD"
secret_name = "ADMIN_PASSWORD"
store_id = "ab2656b141cc49a2833f33f1023737d7"

[[secrets_store_secrets]]
binding = "OPENAI_API_KEY"
secret_name = "OPENAI_API_KEY"
store_id = "ab2656b141cc49a2833f33f1023737d7"

[[secrets_store_secrets]]
binding = "ELEVENLABS_API_KEY"
secret_name = "ELEVENLABS_API_KEY"
store_id = "ab2656b141cc49a2833f33f1023737d7"

[[secrets_store_secrets]]
binding = "LIPSYNC_URL"
secret_name = "VOCOTRIAL_LIPSYNC_URL"
store_id = "ab2656b141cc49a2833f33f1023737d7"

[[secrets_store_secrets]]
binding = "LIPSYNC_API_KEY"
secret_name = "VOCOTRIAL_LIPSYNC_API_KEY"
store_id = "ab2656b141cc49a2833f33f1023737d7"

# CREATE A BUCKET BEFORE PUSHING A BINDING FOR IT. This was true under Pages,
# where a binding naming a missing bucket failed the whole build and left the
# site on the previous commit, and it is still true here: `wrangler deploy`
# refuses the deploy outright. The failure reads as a deploy error rather than
# as a missing bucket; the fix is to create it and deploy again, and nothing
# needs reverting. Learned by doing it in the wrong order.
#
# Each block below is its own bucket rather than a prefix inside another, on one
# repeated reasoning: a binding named for one thing holding another is a lie the
# next reader has to unpick, and buckets cost nothing to create.

# The shared face library. faceKit publishes a kit here and every other browser
# reads it back, which is the only way a face authored on one laptop reaches a
# student on another — kits otherwise live in the authoring browser's IndexedDB
# and go no further. See functions/api/faces/.
#
#   npx wrangler r2 bucket create vocotrial-faces
[[r2_buckets]]
binding = "FACES"
bucket_name = "vocotrial-faces"

# The shared evaluator library. tutorBench authors a level scale here and every
# other browser reads it back — the same journey faces made, and for the same
# reason: a scale authored on one laptop has to reach a student on another.
#
#   npx wrangler r2 bucket create vocotrial-evaluators
[[r2_buckets]]
binding = "EVALUATORS"
bucket_name = "vocotrial-evaluators"

# The published setup library. /teach publishes one lesson here under a code and
# the student page at /eleve reads it back by that code — the only way the
# language, prompt, voice, face and motion assembled on one laptop reach a
# student on another. Without it a student meets the defaults, which is a
# different tutor wearing the same name.
#
#   npx wrangler r2 bucket create vocotrial-sessions
[[r2_buckets]]
binding = "SESSIONS"
bucket_name = "vocotrial-sessions"

# The shared Voco Session library. A Voco Session is one prepared lesson — its
# questions, the consigne the student reads, the structures the teacher wants to
# hear, and the tutor that asks them. Authored on /teach and copied into a
# published setup as text, so this bucket is a teacher's filing cabinet rather
# than part of what a student's browser reads. See functions/api/voco-sessions/.
#
# THE BUCKET NAME PREDATES THE RENAME and is deliberately not being changed. It
# was created as `vocotrial-sheets` when the object was called a sheet; renaming
# a bucket means creating a second one and copying every object into it, to fix
# a string nobody reads except when editing this file. The binding is the name
# that appears throughout the code, and that one is current. The object key
# inside is likewise still `sheets.json` — see functions/api/voco-sessions/_library.ts,
# which reads both field names and writes only the new one.
[[r2_buckets]]
binding = "VOCO_SESSIONS"
bucket_name = "vocotrial-sheets"

# What an administrator decides once, for every teacher: the tutor styles a
# teacher picks between, and the one performance profile every published lesson
# carries. Written from studio, read by /teach, spent by the publish route —
# never read by a student's browser. See functions/api/house/ and house.ts.
#
#   npx wrangler r2 bucket create vocotrial-house
[[r2_buckets]]
binding = "HOUSE"
bucket_name = "vocotrial-house"

# The shared prompt library: the prompts saved on tutorBench, which studio
# publishes as manners. They lived in localStorage until now, and the note in
# src/realtime/savedPrompts.ts records why that stopped being defensible — a
# prompt drafted on the laptop could not be published from the desktop, and the
# two machines held different libraries behind the same picker.
#
# Its own bucket rather than a prefix inside HOUSE. HOUSE is what an
# administrator decides for every teacher; a prompt still being drafted is not
# that, and it becomes a house style only when somebody presses Publish. See
# functions/api/prompts/.
#
#   npx wrangler r2 bucket create vocotrial-prompts
[[r2_buckets]]
binding = "PROMPTS"
bucket_name = "vocotrial-prompts"

# Generated speech and the marks that go with it. It holds three kinds of object
# per line — the audio, the package, and the raw ElevenLabs alignment — under the
# key helpers in src/lipsync/published.ts, which both sides import so neither can
# invent a path the other does not look at.
#
#   npx wrangler r2 bucket create vocotrial-lipsync
[[r2_buckets]]
binding = "LIPSYNC"
bucket_name = "vocotrial-lipsync"
