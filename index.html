<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>vocoTrial — live voice agent</title>
    <!--
      The LingoLabo brand faces, for /eleve. The workshop pages use none of them
      and are unaffected: every rule that asks for one is namespaced `lingo-` in
      tailwind.config.js, and `display=swap` means nothing blocks on the fetch.

      Chelsea Market and Patrick Hand are the brand pair (sciptomondo/STYLE_GUIDE.md);
      Fredoka carries headings, DM Sans the body, JetBrains Mono the one place a
      session code is shown. Chock A Block is not here — it is served from our own
      origin, declared in src/index.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Fredoka:wght@400;600&family=Chelsea+Market&family=Patrick+Hand&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
